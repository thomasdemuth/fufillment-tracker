[project]
name = "fulfillment-tracker"
version = "0.1.0"
description = "Self-hosted shipment tracking dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<0.29",
    "python-multipart>=0.0.12",
    "python-calamine>=0.3,<0.6",
    "openpyxl>=3.1,<4",
    "zipcodes>=3.0,<4",
    "rapidfuzz>=3.9,<4",
    "cryptography>=43",
    "tenacity>=9,<10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "freezegun>=1.5",
    "faker>=30",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
