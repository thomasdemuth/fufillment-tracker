# Publishes the hosted UI (interface only, no data) to GitHub Pages on every push.
# Pages is enabled automatically on the first run (configure-pages with enablement). If your account
# disallows that, set repo Settings -> Pages -> "Build and deployment" source = "GitHub Actions" once.
name: deploy-github-pages
on:
  push:
    branches: [main, master, claude/shipment-tracking-dashboard-mj9c5h]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Enable GitHub Pages (source: GitHub Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build hosted UI under /<repo>/
        run: VITE_BASE="/${{ github.event.repository.name }}/" pnpm build:hosted
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-hosted

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
