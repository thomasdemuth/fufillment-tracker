# Deploys the hosted UI (no data) to Cloudflare Pages on every push to the deploy branches.
#
# One-time setup in the GitHub repo (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   an API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your account id (Cloudflare dashboard -> Workers & Pages -> overview, right column)
# The Pages project is created automatically on the first run with the same name as this repository.
name: deploy-pages
on:
  push:
    branches: [main, master, claude/shipment-tracking-dashboard-mj9c5h]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: frontend
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build hosted UI
        run: pnpm build:hosted
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repository secrets to enable deploys."
            exit 1
          fi
      - name: Create Pages project if missing
        run: |
          if ! pnpm exec wrangler pages project list 2>/dev/null | grep -q "^│ $PROJECT_NAME "; then
            pnpm exec wrangler pages project create "$PROJECT_NAME" --production-branch "${GITHUB_REF_NAME}"
          fi
      - name: Deploy
        run: pnpm exec wrangler pages deploy dist-hosted --project-name "$PROJECT_NAME" --branch "${GITHUB_REF_NAME}" --commit-dirty=true
